name: Alterar titulo PIX
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-subscription-header-alert.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alterar Misael para Pagar sua mensalidade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="${esc(ps.pix_holder||'Recebedor')}"
          new="Pagar sua mensalidade"
          if old in s:
              s=s.replace(old,new,1)
          elif 'Pagar sua mensalidade' in s:
              print('Alteracao ja aplicada')
          else:
              raise SystemExit('Texto do recebedor PIX nao encontrado')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Alterar titulo PIX para Pagar sua mensalidade'
          git push