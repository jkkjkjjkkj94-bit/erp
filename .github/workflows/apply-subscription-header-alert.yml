name: Aplicar status completo da assinatura no cabecalho
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-subscription-header-alert.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar status da assinatura
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.subscription-alert.warning{display:flex;background:#fff6d5;color:#806500;border:1px solid #f1df9c}', '.subscription-alert.warning{display:flex;background:#fff6d5;color:#806500;border:1px solid #f1df9c}.subscription-alert.active{display:flex;background:#eaf8f0;color:#137a47;border:1px solid #bfe8d0}')
          pattern=r"function renderHeaderSubscriptionAlert\(\)\{.*?\}function renderSubscription\(\)\{"
          replacement="""function renderHeaderSubscriptionAlert(){let el=$('subscriptionAlert');if(!el)return;let x=state.profile?.role==='ceo'?(state.ceoStore?state.stores.find(s=>s.id===state.ceoStore):null):state.myStore;el.className='subscription-alert';el.textContent='';if(!x)return;let blocked=!x.active||['blocked','cancelled'].includes(x.subscription_status);let fmt=v=>{if(!v)return '—';let d=new Date(v+'T12:00:00');return d.toLocaleDateString('pt-BR')};if(blocked){el.classList.add('blocked');el.textContent='🔒 LOJA BLOQUEADA · Mensalidade vencida';return}if(x.paid_until){let today=new Date();today.setHours(0,0,0,0);let due=new Date(x.paid_until+'T12:00:00');due.setHours(0,0,0,0);let days=Math.round((due-today)/86400000);if(days<0){el.classList.add('blocked');el.textContent=`🔒 MENSALIDADE VENCIDA · ${fmt(x.paid_until)}`;return}if(days<=5){el.classList.add('warning');el.textContent=days===0?`⚠ VENCE HOJE · ${fmt(x.paid_until)}`:`⚠ VENCE EM ${days} DIA${days===1?'':'S'} · ${fmt(x.paid_until)}`;return}el.classList.add('active');el.textContent=`✓ ASSINATURA ATIVA · VENCE EM ${fmt(x.paid_until)}`;return}if(x.due_day){el.classList.add('warning');el.textContent=`⚠ VENCIMENTO TODO DIA ${x.due_day}`}}function renderSubscription(){"""
          s2,n=re.subn(pattern,replacement,s,count=1)
          if n!=1:
              raise SystemExit('Função de assinatura não encontrada para atualização')
          p.write_text(s2)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Mostrar status e vencimento da assinatura ao lojista'
          git push