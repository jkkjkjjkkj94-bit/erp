name: Corrigir carregamento PIX
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-subscription-header-alert.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Carregar PIX antes de renderizar assinatura
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="state.stores=ceo?(q[9]?.data||[]):[];renderAll()}"
          new="state.stores=ceo?(q[9]?.data||[]):[];await loadPaymentSettings();renderAll()}"
          if old not in s:
              if new in s:
                  print('Correcao ja aplicada')
              else:
                  raise SystemExit('Ponto de refreshAll nao encontrado')
          else:
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Corrigir carregamento dos dados PIX'
          git push