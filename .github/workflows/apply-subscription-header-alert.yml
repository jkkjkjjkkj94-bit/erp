name: Aplicar layout minimalista CEO
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-subscription-header-alert.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar estilo da gestão de lojas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''<style id="ceo-minimal-style">#ceo .tablebox{border:0;box-shadow:none;background:transparent}#ceo .ceo-toolbar{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;padding:14px 16px}#ceo table{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}#ceo th{background:#fff;color:#8a9099;font-size:9px;padding:12px 14px}#ceo td{padding:16px 14px}#ceo tr:hover td{background:#fafafa}#ceo .ceo-actions{align-items:center;gap:7px}#ceo .ceo-actions .mini{border-radius:9px;padding:8px 11px;box-shadow:none}#ceo .ceo-actions .mini.billing,#ceo .ceo-actions .mini.danger,#ceo .ceo-actions .mini.ok{background:#fff;border-color:#e2e5e9;color:#4c525b}#ceo .ceo-actions .mini.danger:hover{color:#b42318;border-color:#efc7c3;background:#fff8f7}#ceo .ceo-actions .mini.ok:hover{color:#137a47;border-color:#bfe8d0;background:#f5fcf8}#ceo .badge{font-size:9px;padding:5px 8px}#ceo .ceo-store-meta{font-size:10px}@media(max-width:1100px){#ceo table{min-width:900px}#ceo .tablebox{overflow:auto}}</style>'''
          if 'id="ceo-minimal-style"' not in s:
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Deixar gestão de lojas mais minimalista'
          git push
