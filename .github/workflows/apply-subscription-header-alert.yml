name: Adicionar pagamento da assinatura
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-subscription-header-alert.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar area de pagamento do lojista
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          css=""".paybox{margin-top:18px;background:#17181b;color:#fff;border-radius:14px;padding:20px}.paybox .muted{color:#aeb3bb}.pay-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.pay-value{font-size:27px;font-weight:950;margin:8px 0 3px}.pixbox{margin-top:14px;background:#fff;color:#17181b;border-radius:11px;padding:15px}.pixkey{font-family:monospace;font-size:13px;word-break:break-all;background:#f6f7f8;border:1px solid #e7e9ec;border-radius:8px;padding:11px;margin:8px 0}.pay-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pay-actions .btn{flex:1;min-width:170px}.payment-note{font-size:11px;color:#737985;margin-top:10px}@media(max-width:760px){.pay-head{align-items:flex-start;flex-direction:column}}"""
          if '.paybox{' not in s:s=s.replace('</style>',css+'</style>',1)
          pat=r"function renderSubscription\(\)\{.*?\}(?=function renderCEO\(\))"
          rep="""function renderSubscription(){let x=state.myStore;if(!x||!$('subscriptionCard'))return;let blocked=!x.active||x.subscription_status==='blocked',fmt=v=>{if(!v)return '—';let d=new Date(v+'T12:00:00');return d.toLocaleDateString('pt-BR')};$('subscriptionCard').innerHTML=`<div style=\"display:flex;justify-content:space-between;gap:15px;align-items:center\"><div><div class=\"muted\">STATUS</div><h2>${blocked?'Loja bloqueada':'Assinatura ativa'}</h2></div><span class=\"badge ${blocked?'danger':'ok'}\">${blocked?'BLOQUEADA':'ATIVA'}</span></div><div class=\"dreline\"><span>Mensalidade</span><b>${money(x.monthly_fee)}</b></div><div class=\"dreline\"><span>Vencimento</span><b>Dia ${x.due_day||'—'}</b></div><div class=\"dreline\"><span>Assinatura válida até</span><b>${fmt(x.paid_until)}</b></div>${x.block_on?`<div class=\"dreline\"><span>Data limite para pagamento</span><b>${fmt(x.block_on)}</b></div>`:''}${x.blocked_reason?`<div class=\"section-note\">Motivo: ${esc(x.blocked_reason)}</div>`:''}<div class=\"paybox\"><div class=\"pay-head\"><div><b>Pagar mensalidade</b><div class=\"muted\">Regularize sua assinatura para manter o acesso ao ERP.</div></div><div><div class=\"muted\">VALOR</div><div class=\"pay-value\">${money(x.monthly_fee)}</div></div></div><div class=\"pixbox\"><b>Pagamento via PIX</b><div class=\"payment-note\">A chave PIX será informada pelo administrador da plataforma. Após pagar, envie o comprovante para confirmação.</div><div class=\"pay-actions\"><button class=\"btn yellow\" onclick=\"requestPaymentInfo()\">Ver instruções de pagamento</button><button class=\"btn secondary\" onclick=\"copyPaymentSummary()\">Copiar dados da cobrança</button></div></div></div>`}function requestPaymentInfo(){let x=state.myStore;modal('Como pagar a mensalidade',`<div class=\"section-note\"><b>Pagamento da assinatura</b><br>Valor: ${money(x?.monthly_fee)}<br>Vencimento: dia ${x?.due_day||'—'}.</div><p>Entre em contato com o administrador da plataforma para receber a chave PIX e enviar o comprovante. O acesso será liberado após a confirmação do pagamento.</p><button class=\"btn w100\" onclick=\"copyPaymentSummary()\">Copiar dados para enviar</button>`)}async function copyPaymentSummary(){let x=state.myStore,t=`Pagamento ERP - Loja: ${x?.name||''} | Mensalidade: ${money(x?.monthly_fee)} | Vencimento: dia ${x?.due_day||'—'}`;try{await navigator.clipboard.writeText(t);toast('Dados da cobrança copiados')}catch(e){toast('Não foi possível copiar')}}"""
          s2,n=re.subn(pat,rep,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderSubscription não encontrado')
          p.write_text(s2)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Adicionar area de pagamento da assinatura'
          git push